name: Publish NEXUS Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npx electron-builder --win nsis --win portable --x64 --publish never
      - name: Prepare portable update feed
        run: node scripts/prepare-release.cjs
      - name: Publish one complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git 标签与 package.json 版本不一致' }
          $assets = @(
            "dist/NEXUS-Workbench-Setup-$version-win-x64.exe"
            "dist/NEXUS-Workbench-Setup-$version-win-x64.exe.blockmap"
            "dist/NEXUS-Workbench-$version-win-x64.exe"
            'dist/latest.yml'
            'dist/latest.json'
          )
          gh release create $env:GITHUB_REF_NAME @assets --repo Yujay-Si/workbench --title "NEXUS 个人工作台 v$version" --generate-notes --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
